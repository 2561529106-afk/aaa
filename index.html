<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>贪吃蛇小游戏</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>贪吃蛇</h1>
      <p class="tips">方向键或 WASD 控制移动，空格暂停/继续，回车重新开始。</p>

      <section class="hud" aria-live="polite">
        <span>分数：<strong id="score">0</strong></span>
        <span>最高分：<strong id="bestScore">0</strong></span>
        <span>速度：<strong id="speed">1</strong></span>
      </section>

      <canvas id="game" width="480" height="480" role="img" aria-label="贪吃蛇游戏画布"></canvas>

      <div class="actions">
        <p id="status" class="status">按任意方向键开始</p>
        <button id="restart" type="button">重新开始</button>
      </div>

      <section class="touch-controls" aria-label="触控方向键">
        <button class="ctrl" data-dir="up" type="button">↑</button>
        <div class="middle-row">
          <button class="ctrl" data-dir="left" type="button">←</button>
          <button class="ctrl" data-dir="down" type="button">↓</button>
          <button class="ctrl" data-dir="right" type="button">→</button>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
